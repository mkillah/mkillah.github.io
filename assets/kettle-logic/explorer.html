<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kettle Logic item browser</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #252822; --muted: #70736d; --bg: #ffffff; --surface: #f7f8f5; --border: #e4e6df;
    --accent: #527f9d; --accent-light: #e8eff4; --good: #034620; --good-light: #eaf1eb;
    --bad: #9c3b2e; --bad-light: #f7e9e6; --warn: #8a6100; --warn-light: #fbf1dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "DM Sans", sans-serif; }
  h2 { font: 600 1.35rem/1.25 "Playfair Display", Georgia, serif; margin: 0 0 4px; }
  h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  button, select { font: inherit; color: inherit; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  select { flex: 1 1 260px; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; }
  .btn:hover { background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); cursor: pointer; font-size: .85rem; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; background: var(--bg); }
  .passage { background: var(--surface); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .tag { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-light); color: var(--ink); }
  .options { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
  .options li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 6px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }
  .options li.is-correct.revealed { border-color: var(--good); background: var(--good-light); }
  .letter { font-weight: 700; }
  .reveal { margin-top: 12px; }
  .why { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--good); background: var(--good-light); border-radius: 0 6px 6px 0; display: none; }
  .why.show { display: block; }
  .why p { margin: 4px 0; }
  .models { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin-top: 14px; }
  .model-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .step { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .step:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .verdict { display: inline-flex; gap: 6px; align-items: baseline; font-weight: 600; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  .probs { display: grid; gap: 3px; margin: 8px 0; }
  .prow { display: grid; grid-template-columns: 16px 1fr 38px; gap: 6px; align-items: center; font-size: .82rem; }
  .ptrack { height: 10px; background: var(--surface); border-radius: 3px; overflow: hidden; }
  .pfill { height: 100%; border-radius: 0 4px 4px 0; }
  .pval { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .quote { font-size: .86rem; margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--border); }
  .badge { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }
  .b-exact { background: var(--good-light); color: var(--good); }
  .b-close { background: var(--warn-light); color: var(--warn); }
  .b-miss { background: var(--bad-light); color: var(--bad); }
  .expl { font-size: .88rem; color: var(--ink); margin: 6px 0 0; }
  .muted { color: var(--muted); font-size: .85rem; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 520px) { body { padding: 12px; } .card { padding: 12px; } }
</style>
</head>
<body>
  <div class="bar">
    <button class="btn" id="prev" aria-label="Previous passage">←</button>
    <select id="picker" aria-label="Choose a passage"></select>
    <button class="btn" id="next" aria-label="Next passage">→</button>
  </div>
  <div class="chips" role="group" aria-label="Filter passages">
    <button class="chip" data-filter="all" aria-pressed="true">All passages</button>
    <button class="chip" data-filter="wrong">A model got it wrong</button>
    <button class="chip" data-filter="disagree">Models disagree</button>
    <button class="chip" data-filter="changed">A model changed its answer</button>
    <button class="chip" data-filter="none">No correct option listed</button>
  </div>
  <div id="view"><p class="empty">Loading…</p></div>

<script>
const LETTERS = ["A", "B", "C", "D", "E"];
let data, filtered = [], index = 0, filter = "all", revealed = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => `${Math.round(v * 100)}%`;

function matches(item) {
  const r = Object.values(item.responses);
  if (!r.length) return filter === "all";
  if (filter === "wrong") return r.some((x) => x.final.choice !== item.correct);
  if (filter === "disagree") return new Set(r.map((x) => x.final.choice)).size > 1;
  if (filter === "changed") return r.some((x) => x.final.choice !== x.first.choice);
  if (filter === "none") return !item.answer_in_options;
  return true;
}

function probBars(p, color, chosen) {
  return `<div class="probs">${LETTERS.map((k) => `
    <div class="prow" title="Option ${k}: ${pct(p[k])}">
      <span class="letter" style="${k === chosen ? "" : "font-weight:400;color:var(--muted)"}">${k}</span>
      <div class="ptrack"><div class="pfill" style="width:${(p[k] * 100).toFixed(1)}%;background:${color}"></div></div>
      <span class="pval">${pct(p[k])}</span>
    </div>`).join("")}</div>`;
}

function quotes(list) {
  if (!list.length) return `<p class="muted">No quotes given.</p>`;
  const label = { exact: ["b-exact", "in passage"], close: ["b-close", "near match"], "not found": ["b-miss", "not in passage"] };
  return list.map((q) => {
    const [cls, text] = label[q.status];
    return `<p class="quote">“${esc(q.text)}”<span class="badge ${cls}">${text}</span></p>`;
  }).join("");
}

function verdict(choice, correct) {
  const ok = choice === correct;
  return revealed
    ? `<span class="verdict ${ok ? "ok" : "no"}">${esc(choice)} <span>${ok ? "✓ matches the annotation" : "✗ differs from the annotation"}</span></span>`
    : `<span class="verdict">${esc(choice)}</span>`;
}

function modelCard(m, r, item) {
  if (!r) return `<div class="card"><div class="model-head"><span class="swatch" style="background:${m.color}"></span>${esc(m.label)}</div><p class="muted">Not run on this passage.</p></div>`;
  const alt = r.alternative;
  const altBlock = alt.exists && alt.choice
    ? `<p>Yes: <strong>${esc(alt.choice)}</strong> <span class="muted">(${Math.round(alt.probability)}% likely)</span></p>${quotes(alt.evidence)}<p class="expl">${esc(alt.explanation)}</p>`
    : `<p>No alternative offered.</p><p class="expl">${esc(alt.explanation)}</p>`;
  const changed = r.final.choice !== r.first.choice;
  return `<div class="card">
    <div class="model-head"><span class="swatch" style="background:${m.color}"></span>${esc(m.label)}</div>
    <div class="step"><h3>1 · First answer</h3>${verdict(r.first.choice, item.correct)}
      ${probBars(r.first.probabilities, m.color, r.first.choice)}${quotes(r.first.evidence)}<p class="expl">${esc(r.first.explanation)}</p></div>
    <div class="step"><h3>2 · Another reading?</h3>${altBlock}</div>
    <div class="step"><h3>3 · Final answer</h3>${verdict(r.final.choice, item.correct)} ${changed ? `<span class="muted">(changed from ${esc(r.first.choice)})</span>` : `<span class="muted">(unchanged)</span>`}
      ${probBars(r.final.probabilities, m.color, r.final.choice)}<p class="expl">${esc(r.final.explanation)}</p></div>
  </div>`;
}

function render() {
  const view = document.getElementById("view");
  if (!filtered.length) {
    const msg = filter === "changed"
      ? "No model changed its answer on any passage, even after naming an alternative reading."
      : "No passages match this filter.";
    view.innerHTML = `<p class="empty">${msg}</p>`;
    return;
  }
  const item = filtered[index];
  document.getElementById("picker").value = String(item.id);
  const labels = item.plausible_labels.map((l) => `${esc(l.label)} (${Math.round(l.weight * 100)}%)`).join(" · ");
  view.innerHTML = `
    <div class="card passage">
      <h2>${esc(item.name)}</h2>
      <div class="tags"><span class="tag">${esc(item.group)}</span><span class="tag">${esc(item.ambiguity)} ambiguity</span></div>
      <p>${esc(item.passage)}</p>
      <p><strong>${esc(item.question)}</strong></p>
      <ul class="options">${LETTERS.map((k) => `<li class="${k === item.correct ? "is-correct" : ""} ${revealed ? "revealed" : ""}"><span class="letter">${k}</span><span>${esc(item.options[k])}</span></li>`).join("")}</ul>
      <button class="btn reveal" id="reveal">${revealed ? "Hide the annotated answer" : "Show the annotated answer"}</button>
      <div class="why ${revealed ? "show" : ""}">
        ${item.answer_in_options
          ? `<p><strong>Annotated answer: ${esc(item.correct)}.</strong> ${esc(item.why)}</p>`
          : `<p><strong>Annotated answer: E. None of the listed statements is correct.</strong> The correct statement was removed from this passage on purpose:</p>
             <p class="quote">“${esc(item.removed_option)}”</p>
             <p>${esc(item.why.replace(/^No listed statement is correct[^"]*"[^"]*"\s*/, ""))}</p>`}
        <p class="muted">Plausible readings: ${labels}</p>
        ${item.context && item.context !== "None needed." ? `<p class="muted">Context: ${esc(item.context)}</p>` : ""}
        <p class="muted">Source: ${esc(item.source)}</p>
      </div>
    </div>
    <div class="models">${data.models.map((m) => modelCard(m, item.responses[m.key], item)).join("")}</div>`;
  document.getElementById("reveal").onclick = () => { revealed = !revealed; render(); };
}

function applyFilter() {
  const current = filtered[index]?.id;
  filtered = data.items.filter(matches);
  const picker = document.getElementById("picker");
  picker.innerHTML = filtered.map((it) => `<option value="${it.id}">${esc(it.name)} — ${esc(it.group)}</option>`).join("");
  const keep = filtered.findIndex((it) => it.id === current);
  index = keep >= 0 ? keep : 0;
  render();
}

async function init() {
  try {
    data = await (await fetch("results.json", { cache: "no-cache" })).json();
  } catch (e) {
    document.getElementById("view").innerHTML = `<p class="empty">Results could not be loaded.</p>`;
    return;
  }
  const start = new URLSearchParams(location.search).get("item");
  document.querySelectorAll(".chip").forEach((chip) => chip.onclick = () => {
    filter = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
    applyFilter();
  });
  document.getElementById("picker").onchange = (e) => { index = filtered.findIndex((it) => String(it.id) === e.target.value); render(); };
  document.getElementById("prev").onclick = () => { index = (index - 1 + filtered.length) % filtered.length; render(); };
  document.getElementById("next").onclick = () => { index = (index + 1) % filtered.length; render(); };
  applyFilter();
  if (start) { const i = filtered.findIndex((it) => String(it.id) === start); if (i >= 0) { index = i; render(); } }
}
init();
</script>
</body>
</html>
